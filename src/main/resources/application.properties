# ============================================================
#  Sistema de Control de Tickets de Entrada (QR) - UAP
#  application.properties - Configuracion base (servidor)
#  Los valores sensibles se dejan vacios; se completan por
#  perfil (application-<perfil>.properties) o en el servidor.
# ============================================================

# --- Datasource --------------------------------------------
spring.datasource.url=jdbc:postgresql://localhost:5432/NOMBRE_BD
spring.datasource.username=
spring.datasource.password=
spring.datasource.driver-class-name=org.postgresql.Driver

# --- JPA / Hibernate ---------------------------------------
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# --- JWT ---------------------------------------------------
app.jwt.secret=
app.jwt.expiration-ms=86400000

# --- CORS --------------------------------------------------
app.cors.allowed-origins=http://localhost:5900

# --- Usuario administrador inicial -------------------------
app.admin.username=
app.admin.password=

# --- OpenAPI / Swagger -------------------------------------
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.enabled=true

# --- Multipart (carga CSV/Excel) ---------------------------
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# --- Servidor ----------------------------------------------
server.port=8080

