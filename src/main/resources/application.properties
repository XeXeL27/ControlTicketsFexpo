# ============================================================
#  Sistema de Control de Tickets de Entrada (QR) - UAP
#  application.properties - Configuracion base (servidor)
#  Los valores sensibles se dejan vacios; se completan por
#  perfil (application-<perfil>.properties) o en el servidor.
# ============================================================

# --- Datasource --------------------------------------------
spring.datasource.url=jdbc:postgresql://localhost:5432/NOMBRE_BD
spring.datasource.username=
spring.datasource.password=
spring.datasource.driver-class-name=org.postgresql.Driver

# --- JPA / Hibernate ---------------------------------------
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# --- JWT ---------------------------------------------------
app.jwt.secret=
app.jwt.expiration-ms=86400000

# --- CORS --------------------------------------------------
app.cors.allowed-origins=http://localhost:5900

# --- Usuario administrador inicial -------------------------
app.admin.username=
app.admin.password=

# --- OpenAPI / Swagger -------------------------------------
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.enabled=true

# --- Multipart (carga CSV/Excel) ---------------------------
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# --- Servidor ----------------------------------------------
server.port=8080

# -- Sigse validacion -------------------------------------------------
# Se leen de variables de entorno: NO escribir la clave aca, este archivo va a git.
# El ':' final significa "si la variable no existe, queda vacio" (no rompe el arranque).
#   export SIGSE_URL=...   export SIGSE_API_KEY=...
# En local se definen en application-jarv.properties, que esta en .gitignore.
sigse.url=${SIGSE_URL:}
sigse.api-key=${SIGSE_API_KEY:}

# --- Feria (FEXPO): fechas reales de cada dia ---------------
# El escaner valida que el boleto corresponda al dia de hoy.
# validar-dia=false apaga esa validacion para poder probar fuera del evento.
app.feria.dia1=2026-09-18
app.feria.dia2=2026-09-19
app.feria.dia3=2026-09-20
app.feria.validar-dia=true
app.feria.zona-horaria=America/La_Paz
