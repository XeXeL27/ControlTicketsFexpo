# ============================================================
#  Sistema de Control de Tickets de Entrada (QR) - UAP
#  application-produccion.properties - Configuracion del SERVIDOR
#  Este archivo SI va a git: no tiene secretos, solo nombres de
#  variables de entorno (ver .gitignore: es la excepcion a
#  application-*.properties). Los valores reales se exportan en el
#  servidor antes de arrancar.
#
#  Arranque:
#    export DB_URL=jdbc:postgresql://localhost:5432/bd_control_tickets_v1
#    export DB_USER=...  DB_PASSWORD=...  JWT_SECRET=...
#    export ADMIN_USER=...  ADMIN_PASSWORD=...
#    export SIGSE_URL=...  SIGSE_API_KEY=...
#    java -jar target/*.jar --spring.profiles.active=produccion
# ============================================================

# --- Datasource (validate: Hibernate NO toca las tablas en el servidor) ---
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/bd_control_tickets_v1}
spring.datasource.username=${DB_USER:}
spring.datasource.password=${DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=validate

# --- JWT (secreto obligatorio: sin el no arranca el login) ---------------
app.jwt.secret=${JWT_SECRET:}
app.jwt.expiration-ms=86400000

# --- CORS -----------------------------------------------------------------
# Mismo origen (front servido por este jar): los navegadores no aplican CORS
# contra el propio host. Solo definir si la API se expone a otro dominio.
app.cors.allowed-origins=${CORS_ORIGINS:http://localhost:9099}

# --- Usuario administrador inicial (solo si la tabla esta vacia) ---------
app.admin.username=${ADMIN_USER:}
app.admin.password=${ADMIN_PASSWORD:}

# --- Servidor (front + API en el mismo puerto) -----------------------------
server.port=9099

# --- SIGSE (matricula; sin esto el escaner no deja entrar estudiantes) ----
sigse.url=${SIGSE_URL:}
sigse.api-key=${SIGSE_API_KEY:}

# --- Feria: en el servidor la validacion de dia va ENCENDIDA --------------
app.feria.validar-dia=true

# --- Swagger: visible pero solo con login (SecurityConfig lo deja pasar,
#     los datos igual exigen token). Para ocultarlo: springdoc.swagger-ui.enabled=false
# springdoc.swagger-ui.enabled=false
